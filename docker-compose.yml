version: '3.9'

services:
  backend:
    build: ./backend
    command: ./start.sh
    environment:
      DATABASE_URL: sqlite:////data/linklens.db
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-me}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DEFAULT_USER_EMAIL: ${DEFAULT_USER_EMAIL:-demo@example.com}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-demo123}
      METADATA_TIMEOUT: 5
      METADATA_USER_AGENT: LinkLensMetadataBot/1.0
      PAGE_SIZE_DEFAULT: 10
      PAGE_SIZE_MAX: 50
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
      - backend-data:/data
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://backend:8000
      VITE_ENABLE_AUTH: ${ENABLE_AUTH:-false}
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  backend-data:
