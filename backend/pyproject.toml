[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "linklens-backend"
version = "0.1.0"
description = "LinkLens backend application"
authors = [{ name = "LinkLens", email = "dev@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.103.0,<0.110.0",
  "uvicorn[standard]>=0.23.0,<0.28.0",
  "sqlmodel>=0.0.14",
  "alembic>=1.12.0,<2.0.0",
  "httpx>=0.24.0,<0.28.0",
  "python-dotenv>=1.0.0",
  "pydantic>=1.10.13,<2.0.0",
  "python-jose>=3.3.0,<4.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "email-validator>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]

